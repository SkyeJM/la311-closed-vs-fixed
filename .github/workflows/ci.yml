# Lint and offline tests on every push to main and every PR. CI never calls the live API:
# tests use pinned schemas and synthetic fixtures. dbt build joins in Phase 2.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
