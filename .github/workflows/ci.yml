# Lint and offline tests on every push to main and every PR. CI never calls the live API:
# tests use pinned schemas and synthetic fixtures. dbt build joins in Phase 2.
# Actions are pinned to commit SHAs (version in the comment) so a moved tag can't change CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
