# Throwaway Vercel project for the hosting spike (deployed from this directory only).
[project]
name = "la311-hosting-spike"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.120", "duckdb>=2.0.0"]

[tool.vercel.scripts]
# Generate the ~320 MB synthetic database during the build instead of uploading it.
build = "python bench_duckdb.py --build-only serving_synthetic.duckdb --rows 18000000"
