# dbt project for Closed ≠ Fixed. Run it through the Makefile (`make build`), which sets the
# paths; run directly from this directory and the defaults below point at ../data.
name: la311
version: "0.2.0"
profile: la311

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false  # no telemetry from local or CI runs

# Raw Parquet is read from $LA311_RAW_ROOT (models/staging/_raw__sources.yml): dbt doesn't render
# Jinja inside `vars`, so the path can't live here.
vars:
  # Raw source tables (models/staging/_raw__sources.yml) by era. tests/test_dbt_project.py checks
  # both against sources.yml, so a new dataset can't be pulled but left out of staging.
  legacy_datasets: [legacy_2015, legacy_2016, legacy_2017, legacy_2018, legacy_2019, legacy_2020,
    legacy_2021, legacy_2022, legacy_2023, legacy_2024, legacy_2025]
  current_datasets: [current_2025, current_2026]
  cutover_date: "2025-03-28"  # first record in the new MyLA311 system (brief section 3.3)
  # Q4 compares equal periods either side of the cutover, skipping the Apr-Aug 2025 overlap when
  # both systems had rows (mart_cutover_periods). Legacy requests still open at the cutover never
  # close in the legacy data, so the legacy period ends `cutover_followup_days` before the cutover
  # and every request in it has that long to close.
  overlap_end_date: "2025-09-01"
  cutover_compare_months: 12
  cutover_followup_days: 30
  # E2 proxy parameters (brief section 4.3), justified from the data in Phase 3 (docs/DECISIONS.md;
  # the evidence is regenerated into findings/findings.json under e2_parameters).
  instant_close_minutes: 1  # the closed-at-intake spike is all under 10 s; 1 min = legacy precision
  rereport_radius_m: 50
  rereport_window_days: 30
  # true since the Phase 3 review (2026-10-28): every observed code is in resolution_code_map.csv,
  # so a new code fails the build (the brief's alerting). Label it with `make label`, review
  # ai/labels/review.csv, then `make label-finalize`. The synthetic fixtures plant an unmapped code
  # and build with this set to false (tests/conftest.py checks that true fails on it).
  code_map_final: true

models:
  la311:
    +materialized: table
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts

seeds:
  la311:
    +schema: seeds
    # Seeds are tiny and their columns change with reviewed decisions; recreating them each build
    # means a new column can't hit a stale table (dbt otherwise reloads into the old one).
    +full_refresh: true

data_tests:
  la311:
    +store_failures: false
