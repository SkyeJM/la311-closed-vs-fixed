# One source table per Socrata dataset in sources.yml (tests/test_dbt_project.py keeps the two in
# sync). Locations are set under `config`, not `meta`, so local paths stay out of the published docs.
sources:
  - name: raw
    description: >
      Raw pulls from data.lacity.org (CC0), written by `make ingest` and `make refresh`: all-VARCHAR
      Parquet with Socrata API field names, values exactly as delivered. Each dataset directory holds
      full.parquet plus any delta_*.parquet refreshes, read together here.
    config:
      external_location: "read_parquet('{{ env_var('LA311_RAW_ROOT', '../data/raw') }}/{identifier}/*.parquet', union_by_name = true, filename = true)"
    tables:
      - name: legacy_2015
        identifier: ms7h-a45h
        description: "MyLA311 Service Request Data 2015: [ms7h-a45h](https://data.lacity.org/d/ms7h-a45h)"
        meta: {dataset_id: ms7h-a45h, era: legacy, year: 2015}
      - name: legacy_2016
        identifier: ndkd-k878
        description: "MyLA311 Service Request Data 2016: [ndkd-k878](https://data.lacity.org/d/ndkd-k878)"
        meta: {dataset_id: ndkd-k878, era: legacy, year: 2016}
      - name: legacy_2017
        identifier: eq98-9f8w
        description: "MyLA311 Service Request Data 2017: [eq98-9f8w](https://data.lacity.org/d/eq98-9f8w)"
        meta: {dataset_id: eq98-9f8w, era: legacy, year: 2017}
      - name: legacy_2018
        identifier: h65r-yf5i
        description: "MyLA311 Service Request Data 2018: [h65r-yf5i](https://data.lacity.org/d/h65r-yf5i)"
        meta: {dataset_id: h65r-yf5i, era: legacy, year: 2018}
      - name: legacy_2019
        identifier: pvft-t768
        description: "MyLA311 Service Request Data 2019: [pvft-t768](https://data.lacity.org/d/pvft-t768)"
        meta: {dataset_id: pvft-t768, era: legacy, year: 2019}
      - name: legacy_2020
        identifier: rq3b-xjk8
        description: "MyLA311 Service Request Data 2020: [rq3b-xjk8](https://data.lacity.org/d/rq3b-xjk8)"
        meta: {dataset_id: rq3b-xjk8, era: legacy, year: 2020}
      - name: legacy_2021
        identifier: 97z7-y5bt
        description: "MyLA311 Service Request Data 2021: [97z7-y5bt](https://data.lacity.org/d/97z7-y5bt)"
        meta: {dataset_id: 97z7-y5bt, era: legacy, year: 2021}
      - name: legacy_2022
        identifier: i5ke-k6by
        description: "MyLA311 Service Request Data 2022: [i5ke-k6by](https://data.lacity.org/d/i5ke-k6by)"
        meta: {dataset_id: i5ke-k6by, era: legacy, year: 2022}
      - name: legacy_2023
        identifier: 4a4x-mna2
        description: "MyLA311 Service Request Data 2023: [4a4x-mna2](https://data.lacity.org/d/4a4x-mna2)"
        meta: {dataset_id: 4a4x-mna2, era: legacy, year: 2023}
      - name: legacy_2024
        identifier: b7dx-7gc3
        description: "MyLA311 Service Request Data 2024: [b7dx-7gc3](https://data.lacity.org/d/b7dx-7gc3)"
        meta: {dataset_id: b7dx-7gc3, era: legacy, year: 2024}
      - name: legacy_2025
        identifier: h73f-gn57
        description: "MyLA311 Service Request Data 2025: [h73f-gn57](https://data.lacity.org/d/h73f-gn57)"
        meta: {dataset_id: h73f-gn57, era: legacy, year: 2025}
      - name: current_2025
        identifier: 73a2-6ar5
        description: "MyLA311 Cases March 2025 to December 2025: [73a2-6ar5](https://data.lacity.org/d/73a2-6ar5)"
        meta: {dataset_id: 73a2-6ar5, era: current, year: 2025}
      - name: current_2026
        identifier: 2cy6-i7zn
        description: "MyLA311 Cases 2026: [2cy6-i7zn](https://data.lacity.org/d/2cy6-i7zn)"
        meta: {dataset_id: 2cy6-i7zn, era: current, year: 2026}
      - name: manifests
        description: >
          One row per dataset from data/raw/{id}/manifest.json: what is on disk now, the live row
          count taken right after the last full pull or refresh, and every delta file.
        config:
          external_location: >-
            read_json('{{ env_var('LA311_RAW_ROOT', '../data/raw') }}/*/manifest.json', format = 'auto', columns = {
            dataset_id: 'VARCHAR', name: 'VARCHAR', era: 'VARCHAR', pulled_at: 'TIMESTAMPTZ',
            method: 'VARCHAR', "rows": 'BIGINT', live_count_after_pull: 'BIGINT',
            deltas: 'STRUCT(file VARCHAR, pulled_at TIMESTAMPTZ, "rows" BIGINT, live_count_after_refresh BIGINT)[]'})
          formatter: oldstyle  # leave the braces above alone
