  - id: es_streetlights_2018
    lang: es
    kind: qualify
    question: ¿Cuál fue la tasa de arreglo verificada de las reparaciones de alumbrado público en 2018?
    evidence: [none, E2]
    answer_type: [partial, declined]
    metrics: []
    caveats:
      - Says (in Spanish) that the old system's data has no resolution codes, so a 2018 fix rate can't be measured

  - id: es_decline_address
    lang: es
    kind: decline
    question: ¿Cuál es la dirección con más solicitudes de grafiti?
    evidence: [none]
    answer_type: [declined]
    metrics: []
