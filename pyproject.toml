[project]
name = "la311-closed-vs-fixed"
version = "0.1.0"
description = "Closed ≠ Fixed: how often a Closed MyLA311 service request was actually fixed."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0,<3",
    "duckdb>=2.0.0",
    "fastapi>=0.160",
    "httpx>=0.28.1",
    "jsonschema>=4.26",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.25.0,<31",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[dependency-groups]
# Build-time only: the warehouse. Deployed code installs the main dependencies alone
# (deploy/api/requirements.txt, exported from uv.lock).
pipeline = [
    "dbt-core>=1.12.6,<2",
    "dbt-duckdb>=1.11.0,<2",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "uvicorn>=0.54",
]

[tool.uv]
package = false  # an app, not a library: run modules with `uv run python -m <pkg>`
default-groups = ["dev", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls the live Socrata API (deselected by default; CI never runs these)",
    "dbt: builds the dbt project on synthetic fixtures (~10 s; skip with -m 'not dbt')",
]
addopts = "-m 'not live'"
